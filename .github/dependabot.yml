# Dependabot — free, GitHub-native. Opens PRs to bump npm deps (incl. security).
# Copy into <repo>/.github/dependabot.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
